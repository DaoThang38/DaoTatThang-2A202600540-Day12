version: "3.9"

services:
  agent:
    build: .
    ports:
      - "8000-8010:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=my-secret-key
    depends_on:
      - redis
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
